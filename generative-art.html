<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baraka Generative Art | فن المساحة المحرمة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #050508; --panel: #111827; --border: #1e293b;
            --text: #e5e7eb; --text-muted: #94a3b8;
            --gold: #d4af37; --cyan: #38bdf8; --purple: #a855f7;
        }
        body { font-family: 'Georgia', 'Amiri', 'Segoe UI', serif; background: var(--bg); color: var(--text); line-height: 1.8; padding: 24px 16px; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; flex-grow: 1; display: flex; flex-direction: column; }
        
        header { text-align: center; padding: 20px 0 30px; border-bottom: 2px solid var(--gold); margin-bottom: 30px; }
        header h1 { font-size: 28px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
        header p { font-size: 14px; color: var(--text-muted); font-style: italic; }
        header .author { font-size: 16px; color: var(--cyan); font-weight: 600; margin-top: 10px; }
        
        .art-stage {
            position: relative;
            width: 100%;
            height: 550px;
            background: #000;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        .hud {
            position: absolute;
            top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            pointer-events: none;
        }
        .hud-box {
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            backdrop-filter: blur(5px);
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            background: var(--panel);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .control-group label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
        .control-group .val { color: var(--gold); font-family: monospace; font-weight: bold; float: left; }
        input[type="range"] { width: 100%; accent-color: var(--gold); }
        
        .buttons { display: flex; gap: 10px; margin-top: 15px; grid-column: 1 / -1; flex-wrap: wrap; }
        button {
            flex: 1; min-width: 150px; padding: 14px;
            border: none; border-radius: 8px; font-weight: bold; font-size: 15px;
            cursor: pointer; font-family: inherit; transition: 0.3s; color: #000;
        }
        .btn-gold { background: var(--gold); }
        .btn-cyan { background: var(--cyan); }
        .btn-purple { background: var(--purple); color: #fff; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); opacity: 0.9; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Baraka Generative Art</h1>
        <p>فن توليدي لا نهائي مبني على "المعادلة الأم" - إثبات أن الجمال يمكن أن يُشتق رياضياً</p>
        <div class="author">الأستاذ / محمد عيد عبد العليم بركة</div>
    </header>

    <div class="art-stage">
        <div class="hud">
            <div class="hud-box" style="color: var(--gold);">🎨 Forbidden Canvas</div>
            <div class="hud-box" style="color: var(--cyan);">R = 0 (Unique Art)</div>
        </div>
        <canvas id="artCanvas"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>الهوية الفنية (C): <span class="val" id="cVal">1.00</span></label>
            <input type="range" id="cSlider" min="0.1" max="10" step="0.01" value="1.0">
        </div>
        <div class="control-group">
            <label>سرعة الرسم (t): <span class="val" id="tVal">0.01</span></label>
            <input type="range" id="tSlider" min="0.001" max="0.05" step="0.001" value="0.01">
        </div>
        
        <div class="buttons">
            <button class="btn-gold" onclick="generateNewArt()">✨ توليد لوحة جديدة</button>
            <button class="btn-cyan" onclick="downloadArt()">📥 حفظ اللوحة (PNG)</button>
            <button class="btn-purple" onclick="toggleAnimation()" id="playBtn">⏸️ إيقاف الحركة</button>
        </div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// BARAKA GENERATIVE ART ENGINE
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('artCanvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
    width = canvas.parentElement.clientWidth;
    height = canvas.parentElement.clientHeight;
    canvas.width = width;
    canvas.height = height;
    // إعادة الرسم عند تغيير الحجم
    drawInitial(); 
}

// متغيرات المعادلة الأم
let x, y, z;
let C = 1.0;
let speed = 0.01;
let hue = 0;
let isAnimating = true;
let animationId;

function initParams() {
    C = parseFloat(document.getElementById('cSlider').value);
    speed = parseFloat(document.getElementById('tSlider').value);
    
    // نقطة البداية تعتمد على C (الهوية)
    x = Math.sin(C);
    y = Math.cos(C * 1.618);
    z = Math.sin(C * 2.718);
    
    hue = (C * 137.5) % 360; // توزيع الألوان بناءً على الزاوية الذهبية
    
    // مسح اللوحة
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
    ctx.globalCompositeOperation = 'lighter'; // تأثير الإضاءة
}

function drawStep() {
    if (!isAnimating) return;

    // ─── المعادلة التفاضلية (ODE) ───
    const dx = Math.sin(x * y) + C;
    const dy = Math.cos(y * z) - C;
    const dz = Math.sin(z * x) + C;

    x += dx * speed;
    y += dy * speed;
    z += dz * speed;

    // ─── تحويل الإحداثيات إلى الشاشة ───
    // نستخدم دالة الجيب لضمان بقاء الرسم داخل حدود الشاشة
    const px = width / 2 + Math.sin(x) * (width / 3);
    const py = height / 2 + Math.cos(y) * (height / 3);

    // ─── الألوان الفنية ───
    hue = (hue + 0.5) % 360;
    // استخدام تدرج لوني ذهبي وسماوي وبنفسجي
    const color = `hsla(${hue}, 80%, 60%, 0.4)`;

    // ─── الرسم ───
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.arc(px, py, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // تأثير الوهج (Glow)
    ctx.beginPath();
    ctx.fillStyle = `hsla(${hue}, 80%, 70%, 0.1)`;
    ctx.arc(px, py, 4, 0, Math.PI * 2);
    ctx.fill();

    animationId = requestAnimationFrame(drawStep);
}

function drawInitial() {
    initParams();
    // رسم بعض النقاط الأولية
    for(let i=0; i<100; i++) {
        const dx = Math.sin(x * y) + C;
        const dy = Math.cos(y * z) - C;
        const dz = Math.sin(z * x) + C;
        x += dx * speed; y += dy * speed; z += dz * speed;
        
        const px = width / 2 + Math.sin(x) * (width / 3);
        const py = height / 2 + Math.cos(y) * (height / 3);
        ctx.fillStyle = `hsla(${hue}, 80%, 60%, 0.4)`;
        ctx.beginPath();
        ctx.arc(px, py, 1, 0, Math.PI * 2);
        ctx.fill();
        hue = (hue + 1) % 360;
    }
    if(isAnimating) drawStep();
}

// ═══════════════════════════════════════════════════════════════
// UI CONTROLS
// ═══════════════════════════════════════════════════════════════
document.getElementById('cSlider').addEventListener('input', (e) => {
    document.getElementById('cVal').textContent = parseFloat(e.target.value).toFixed(2);
    if(animationId) cancelAnimationFrame(animationId);
    drawInitial();
});

document.getElementById('tSlider').addEventListener('input', (e) => {
    document.getElementById('tVal').textContent = parseFloat(e.target.value).toFixed(3);
    speed = parseFloat(e.target.value);
});

function generateNewArt() {
    // توليد ثابت تكامل عشوائي (هوية فنية جديدة)
    const randomC = (Math.random() * 9.9 + 0.1).toFixed(2);
    document.getElementById('cSlider').value = randomC;
    document.getElementById('cVal').textContent = randomC;
    
    if(animationId) cancelAnimationFrame(animationId);
    drawInitial();
    if(!isAnimating) toggleAnimation(); // تشغيل الحركة إذا كانت متوقفة
}

function toggleAnimation() {
    isAnimating = !isAnimating;
    const btn = document.getElementById('playBtn');
    if (isAnimating) {
        btn.textContent = "⏸️ إيقاف الحركة";
        drawStep();
    } else {
        btn.textContent = "▶️ بدء الحركة";
        if(animationId) cancelAnimationFrame(animationId);
    }
}

function downloadArt() {
    const link = document.createElement('a');
    link.download = `Baraka_Art_C_${C.toFixed(2)}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
}

// التشغيل
window.addEventListener('resize', () => {
    if(animationId) cancelAnimationFrame(animationId);
    resize();
});
setTimeout(resize, 100); // تأخير بسيط لضمان تحميل الحجم الصحيح
</script>
</body>
</html>
